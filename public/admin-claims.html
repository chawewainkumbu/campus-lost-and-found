<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Claims | Campus Lost & Found</title>

    <style>
        :root {
            --green: #006b3f;
            --light-green: #e7f3ec;
            --gold: #f4c430;
            --red: #b42318;
            --background: #f4f7f5;
            --border: #dce5df;
            --muted: #66736b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--background);
            color: #202820;
        }

        header {
            background: var(--green);
            color: white;
            padding: 18px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        header a {
            color: white;
            text-decoration: none;
            margin-left: 16px;
        }

        main {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        h1, h2 {
            color: var(--green);
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin: 25px 0;
        }

        .card, .panel {
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .summary strong {
            display: block;
            font-size: 28px;
            color: var(--green);
            margin-top: 8px;
        }

        .muted {
            color: var(--muted);
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 18px 0;
        }

        input, select {
            font: inherit;
            padding: 11px;
            border: 1px solid #cbd7cf;
            border-radius: 7px;
        }

        input {
            flex: 1;
            min-width: 200px;
        }

        button {
            border: 0;
            padding: 10px 14px;
            border-radius: 7px;
            cursor: pointer;
            font: inherit;
        }

        button:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .approve {
            background: var(--green);
            color: white;
        }

        .reject {
            background: var(--red);
            color: white;
        }

        .secondary {
            background: var(--light-green);
            color: var(--green);
        }

        .claim {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px;
            margin: 15px 0;
            overflow-wrap: anywhere;
        }

        .claim h3 {
            margin-top: 0;
            color: var(--green);
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            background: #fff1c2;
            font-size: 13px;
            text-transform: capitalize;
        }

        .status.approved {
            background: #d9f4e2;
            color: #176c3d;
        }

        .status.rejected {
            background: #fde8e8;
            color: #a51622;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .message {
            padding: 14px;
            border-radius: 8px;
            background: white;
            margin: 15px 0;
        }

        .error {
            color: var(--red);
        }

        .success {
            color: var(--green);
        }

        @media (max-width: 600px) {
            header {
                align-items: flex-start;
            }

            header nav {
                display: flex;
                flex-wrap: wrap;
                gap: 12px;
            }

            header a {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>

<header>
    <strong>UNZA | Campus Lost & Found — Administration</strong>

    <nav>
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="admin-claims.html">Manage Claims</a>
        <a href="#" id="logoutButton">Log out</a>
    </nav>
</header>

<main>
    <h1>Manage Student Claims</h1>

    <p class="muted">
        Review ownership explanations before approving or rejecting claims.
    </p>

    <div id="pageMessage" class="message" role="status">
        Checking access and loading claims...
    </div>

    <section class="summary">
        <div class="card">
            Total Claims
            <strong id="totalCount">0</strong>
        </div>

        <div class="card">
            Pending
            <strong id="pendingCount">0</strong>
        </div>

        <div class="card">
            Approved
            <strong id="approvedCount">0</strong>
        </div>

        <div class="card">
            Rejected
            <strong id="rejectedCount">0</strong>
        </div>
    </section>

    <section class="panel">
        <h2>Submitted Claims</h2>

        <div class="filters">
            <input
                type="search"
                id="searchInput"
                placeholder="Search by item or claim explanation"
            >

            <select id="statusFilter">
                <option value="all">All statuses</option>
                <option value="pending">Pending</option>
                <option value="approved">Approved</option>
                <option value="rejected">Rejected</option>
                <option value="cancelled">Cancelled</option>
            </select>

            <button class="secondary" id="refreshButton">
                Refresh
            </button>
        </div>

        <div id="claimsList"></div>
    </section>
</main>

<script>
(() => {
    const API_URL = "http://localhost:5000/api";
    const token = localStorage.getItem("token");

    const pageMessage = document.getElementById("pageMessage");
    const claimsList = document.getElementById("claimsList");

    const searchInput = document.getElementById("searchInput");
    const statusFilter = document.getElementById("statusFilter");

    let claims = [];
    let authorised = false;

    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[character]);
    }

    function showMessage(text, type = "") {
        pageMessage.className = "message " + type;
        pageMessage.textContent = text;
    }

    async function api(path, options = {}) {
        const response = await fetch(API_URL + path, {
            ...options,
            headers: {
                ...(options.body
                    ? { "Content-Type": "application/json" }
                    : {}),
                Authorization: `Bearer ${token}`,
                ...(options.headers || {})
            }
        });

        const data = await response.json().catch(() => ({}));

        if (response.status === 401) {
            localStorage.removeItem("token");
            localStorage.removeItem("user");
            window.location.href = "login.html";

            throw new Error("Your session has expired. Please sign in again.");
        }

        if (!response.ok || data.success === false) {
            throw new Error(
                data.message || `Request failed (${response.status}).`
            );
        }

        return data;
    }

    function unwrap(data) {
        if (Array.isArray(data)) return data;

        for (const key of ["claims", "data", "results"]) {
            if (Array.isArray(data?.[key])) return data[key];
        }

        return [];
    }

    async function verifyAdmin() {
        if (!token) {
            window.location.href = "login.html";
            return false;
        }

        // This page's data and actions are also protected by the backend.
        // Check the current user's role through the stored login profile.
        let user = null;

        try {
            user = JSON.parse(localStorage.getItem("user") || "null");
        } catch {
            user = null;
        }

        if (!user || !["admin", "super_admin", "staff"].includes(user.role)) {
            showMessage(
                "Administrator access could not be verified. Sign in with your admin account.",
                "error"
            );
            return false;
        }

        return true;
    }

    function updateSummary() {
        document.getElementById("totalCount").textContent = claims.length;

        document.getElementById("pendingCount").textContent =
            claims.filter(c => String(c.status).toLowerCase() === "pending").length;

        document.getElementById("approvedCount").textContent =
            claims.filter(c => String(c.status).toLowerCase() === "approved").length;

        document.getElementById("rejectedCount").textContent =
            claims.filter(c => String(c.status).toLowerCase() === "rejected").length;
    }

    function renderClaims() {
        updateSummary();

        const query = searchInput.value.trim().toLowerCase();
        const selectedStatus = statusFilter.value;

        const filtered = claims.filter(claim => {
            const status = String(claim.status || "pending").toLowerCase();

            const searchable = [
                claim.item_name,
                claim.found_item_name,
                claim.claim_description,
                claim.description,
                claim.id,
                claim.claim_id,
                claim.user_id,
                claim.full_name,
                claim.student_name
            ].join(" ").toLowerCase();

            return (!query || searchable.includes(query)) &&
                (selectedStatus === "all" || status === selectedStatus);
        });

        if (!filtered.length) {
            claimsList.innerHTML =
                '<div class="message">No claims match the selected filters.</div>';
            return;
        }

        claimsList.innerHTML = filtered.map(claim => {
            const id = claim.id ?? claim.claim_id;
            const status = String(claim.status || "pending").toLowerCase();

            const itemName =
                claim.item_name ||
                claim.found_item_name ||
                `Found item #${claim.found_item_id ?? "unknown"}`;

            const explanation =
                claim.claim_description ||
                claim.description ||
                "No explanation provided.";

            const student =
                claim.full_name ||
                claim.student_name ||
                (claim.user_id != null ? `User #${claim.user_id}` : "Not provided");

            const canReview = status === "pending" && id != null;

            return `
                <article class="claim">
                    <h3>${escapeHTML(itemName)}</h3>

                    <p>
                        <strong>Claim ID:</strong>
                        ${escapeHTML(id ?? "Unknown")}
                    </p>

                    <p>
                        <strong>Student:</strong>
                        ${escapeHTML(student)}
                    </p>

                    <p>
                        <strong>Found item ID:</strong>
                        ${escapeHTML(claim.found_item_id ?? "Not provided")}
                    </p>

                    <p>
                        <strong>Match ID:</strong>
                        ${escapeHTML(claim.match_id ?? "Not provided")}
                    </p>

                    <p>
                        <strong>Explanation:</strong><br>
                        ${escapeHTML(explanation)}
                    </p>

                    <p>
                        <strong>Status:</strong>
                        <span class="status ${escapeHTML(status)}">
                            ${escapeHTML(status)}
                        </span>
                    </p>

                    ${canReview ? `
                        <div class="actions">
                            <button class="approve"
                                data-action="approved"
                                data-id="${escapeHTML(id)}">
                                Approve Claim
                            </button>

                            <button class="reject"
                                data-action="rejected"
                                data-id="${escapeHTML(id)}">
                                Reject Claim
                            </button>
                        </div>
                    ` : ""}
                </article>
            `;
        }).join("");
    }

    async function loadClaims() {
        if (!authorised) return;

        showMessage("Loading claims...");

        try {
            const result = await api("/claims");
            claims = unwrap(result);
            renderClaims();

            showMessage(
                `Loaded ${claims.length} claim(s).`,
                "success"
            );
        } catch (error) {
            console.error("Load claims failed:", error);

            showMessage(
                "Unable to load claims: " + error.message,
                "error"
            );
        }
    }

    claimsList.addEventListener("click", async event => {
        const button = event.target.closest("button[data-action]");
        if (!button) return;

        const id = button.dataset.id;
        const status = button.dataset.action;

        if (!["approved", "rejected"].includes(status)) return;

        const action = status === "approved" ? "approve" : "reject";

        if (!confirm(`Are you sure you want to ${action} claim #${id}?`)) {
            return;
        }

        button.disabled = true;

        try {
            const result = await api(
                `/claims/${encodeURIComponent(id)}/status`,
                {
                    method: "PATCH",
                    body: JSON.stringify({
                        status,
                        verification_notes: ""
                    })
                }
            );

            showMessage(
                result.message || `Claim #${id} ${status} successfully.`,
                "success"
            );

            await loadClaims();
        } catch (error) {
            console.error("Update claim failed:", error);

            showMessage(
                `Unable to ${action} claim #${id}: ${error.message}`,
                "error"
            );
        } finally {
            button.disabled = false;
        }
    });

    document.getElementById("refreshButton")
        .addEventListener("click", loadClaims);

    searchInput.addEventListener("input", renderClaims);
    statusFilter.addEventListener("change", renderClaims);

    document.getElementById("logoutButton")
        .addEventListener("click", event => {
            event.preventDefault();

            localStorage.removeItem("token");
            localStorage.removeItem("user");

            window.location.href = "login.html";
        });

    async function initialise() {
        authorised = await verifyAdmin();

        if (authorised) {
            await loadClaims();
        }
    }

    initialise();
})();
</script>

</body>
</html>
